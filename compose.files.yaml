# Selected by bootstrap for OB_TLS_ISSUER=files: operator certificate files, never created by Docker.
services:
  caddy:
    volumes:
      - type: bind
        source: ${OB_TLS_DIR:?OB_TLS_DIR must hold tls.crt and tls.key}
        target: /certs
        read_only: true
        bind:
          create_host_path: false
