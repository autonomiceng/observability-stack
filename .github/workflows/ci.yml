name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly full boot of the pinned images so rot is caught between merges.
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: scripts/validate.sh
      - run: python3 -m unittest discover -s tests -v
      - name: Render fresh configuration in isolated scratch
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix="observability-render-") as directory:
              scratch = Path(directory)
              env = os.environ | {
                  "OB_STATE_DIR": str(scratch / "state"),
                  "OB_BACKUP_DIR": str(scratch / "backups"),
              }
              subprocess.run(
                  ["python3", "scripts/bootstrap.py", "--env-file", str(scratch / ".env"), "--render-only"],
                  env=env, stdout=subprocess.DEVNULL, check=True,
              )
              assert (scratch / ".env").stat().st_size > 0
              assert (scratch / "data" / "derived.env").stat().st_size > 0
          PY

  smoke:
    name: Smoke contract (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [filesystem, s3]
    env:
      SMOKE_PROFILE: ${{ matrix.profile }}
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: scripts/smoke.sh

  recovery:
    name: Recovery contract (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [filesystem, s3]
    env:
      SMOKE_PROFILE: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: scripts/backup-drill.sh
